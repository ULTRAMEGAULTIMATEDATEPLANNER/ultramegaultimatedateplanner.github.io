# Telegram alert for tickets to the sold-out You Can See Everything screening (IDFA, Sun 15 Nov 20:30, The Pulse 1).
# Runs back to back: each run checks about twice a minute for 5.5 hours, then starts the next run
# (trying again if GitHub refuses); the 5-minute schedule is a backup if the chain ever breaks. It needs two repository secrets,
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID, and switches itself off once the screening starts.
# With IDFA_VOUCHER_CODES (our Festival Voucher codes) it sends the codes with the alert; it never buys.
# The Cineville booking (CINEVILLE_PASSES, TICKET_EMAIL, TICKET_LAST_NAME) is switched off in watch.mjs.
# Details: .github/ticket-alert/README.md
name: Ticket alert

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:   # a change to the bot itself starts it too: the way back in when GitHub ignores "Run workflow" (4 Nov)
    branches: [main]
    paths:
      - ".github/ticket-alert/**"
      - ".github/workflows/ticket-alert.yml"

permissions:
  contents: write   # its memory, state.json, lives on the ticket-alert-state branch
  actions: write    # to start the next run, and to switch this workflow off after the screening

concurrency:
  group: ticket-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # one run watches for 5.5 hours (RUN_SECONDS), then starts the next
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ticket-alert
      # The Cineville booking also needed: npm install --no-save --no-audit --no-fund --prefix .github/ticket-alert playwright-core@1.56.1
      # (a step before this one). Put it back only if booking (AUTO in watch.mjs) is ever switched on again.
      - name: Check for tickets
        run: node .github/ticket-alert/watch.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CINEVILLE_PASSES: ${{ secrets.CINEVILLE_PASSES }}
          TICKET_EMAIL: ${{ secrets.TICKET_EMAIL }}
          TICKET_LAST_NAME: ${{ secrets.TICKET_LAST_NAME }}
          IDFA_VOUCHER_CODES: ${{ secrets.IDFA_VOUCHER_CODES }}   # sent to us with the alert, never logged
          CHECKS: "100000"       # no cap on the number of checks: RUN_SECONDS decides when a run ends
          RUN_SECONDS: "19800"   # 5.5 hours, so the chain hands over about four times a day
          BOOK_ONE_AT_A_TIME: "no"   # "yes": when only one seat is free, book it on the first pass, the next on the next
          GITHUB_TOKEN: ${{ github.token }}
