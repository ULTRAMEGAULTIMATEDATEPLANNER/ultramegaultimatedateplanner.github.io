# Telegram alert for tickets to the sold-out Nieuw Nederlands Peil 2 screening (Sun 1 Nov 16:20, LAB111).
# Runs back to back: each run checks about twice a minute for 4.5 minutes, then starts the next run;
# the 5-minute schedule restarts the chain if it ever breaks. It needs two repository secrets,
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID, and switches itself off once the screening starts.
# With three more, CINEVILLE_PASSES, TICKET_EMAIL and TICKET_LAST_NAME, it books the free Cineville
# tickets itself when seats appear (in Chrome, which GitHub's runners have).
# Details: .github/ticket-alert/README.md
name: Ticket alert

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # its memory, state.json, lives on the ticket-alert-state branch
  actions: write    # to start the next run, and to switch this workflow off after the screening

concurrency:
  group: ticket-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ticket-alert
      - name: Get the browser driver for booking
        run: npm install --no-save --no-audit --no-fund --prefix .github/ticket-alert playwright-core@1.56.1
      - name: Check for tickets
        run: node .github/ticket-alert/watch.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CINEVILLE_PASSES: ${{ secrets.CINEVILLE_PASSES }}
          TICKET_EMAIL: ${{ secrets.TICKET_EMAIL }}
          TICKET_LAST_NAME: ${{ secrets.TICKET_LAST_NAME }}
          GITHUB_TOKEN: ${{ github.token }}
